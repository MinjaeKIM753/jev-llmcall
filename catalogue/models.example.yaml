# 모델 카드. 버전 2026-11-02.
# 표준 단가(USD / 1M tok)는 공급사 문서에서 확인한 값이다.
# price 가 null 이면 자동 선택에서 빠진다.
# long_context_after 를 넘는 요청은 입력·출력 전체가 long_price 로 계산된다.
# scheduled 는 날짜가 되면 바뀌는 단가다. from 이 지난 마지막 단계가 적용된다.
# quality 에 없는 과제는 none 이다.
# 약 은 policy 의 quality_multiplier.weak (2.0) 를 곱한다.
# image / tools 는 이 세대 대화 모델이 받는다는 전제다. 아니면 false 로 고친다.
# tier 는 economy / standard / premium / frontier. 호출자가 넘긴 id만 후보가 된다.
