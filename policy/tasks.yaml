# Jev에게 보내는 질문. 모델 이름은 넣지 않는다.
# 2026-10-22. 난이도와 실수 비용은 별도 질문이다.
version: "2026-10-22"

task:
  instructions: "마지막 사용자 문장이 어떤 일인지 하나 고른다. 더 어려운 쪽이 분명하면 그쪽으로 간다."
  criteria:
    quick: "인사, 한 줄 사실, 아주 짧은 수정."
    writing: "메일, 요약, 번역, 글을 쓰거나 다듬는 일."
    data: "숫자, 표, 스프레드시트, 계산."
    document: "슬라이드, 보고서, 계약처럼 문서를 만드는 일."
    code: "프로그램, 스크립트, SQL, 버그 수정."
    research: "최신 정보나 바깥 출처가 필요한 일."
    hard: "설계, 비교, 여러 단계의 판단."

difficulty:
  instructions: "일의 단계가 얼마나 많은가. 아래는 낮은 쪽에서 높은 쪽 순서다."
  criteria:
    - "기계적인 변환이나 한 줄이다."
    - "한 단계로 끝나는 평범한 일이다."
    - "여러 단계이지만 범위는 분명하다."
    - "설계나 긴 추론이 필요하다."

stakes:
  instructions: "미묘하게 틀린 답의 비용이 큰가?"

output_size:
  instructions: "답이 얼마나 길까. 아래는 짧은 쪽에서 긴 쪽 순서다."
  criteria:
    - "한 줄이나 짧은 답."
    - "몇 문단."
    - "긴 문서나 많은 코드."
